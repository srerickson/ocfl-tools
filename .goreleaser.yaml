version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy

builds:
  - binary: ocfl
    main: ./cmd/ocfl
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64_v1
      - linux_arm64
      - windows_amd64_v1
      - darwin_arm64

    ldflags:
      - -X github.com/srerickson/ocfl-tools/cmd/ocfl/run.Version={{.Version}} 
      - -X github.com/srerickson/ocfl-tools/cmd/ocfl/run.BuildTime={{.Date}}

archives:
  - formats: tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - repository:
      owner: srerickson
      name: homebrew-ocfl-tools
    name: ocfl
    homepage: https://github.com/srerickson/ocfl-tools
    description: Command-line tools for working with OCFL repositories
    binaries:
      - ocfl
    # Homebrew won't link the binary if the old `ocfl` formula is still
    # installed, so tell upgraders to remove it.
    caveats: |
      If a previous version was installed with the `ocfl` formula, remove it so
      that this version is linked:
        brew uninstall --formula ocfl && brew link --overwrite --cask ocfl
    # The darwin binaries are only ad-hoc signed, so Gatekeeper kills
    # them (SIGKILL) when they carry the quarantine attribute applied to
    # downloaded files. Strip it after staging.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ocfl"]
          end
